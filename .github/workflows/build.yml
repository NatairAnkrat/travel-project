name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'backend-java/**'
      - 'backend-python/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend-java
        uses: docker/build-push-action@v6
        with:
          context: ./backend-java
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/backend-java:latest
            ghcr.io/${{ env.OWNER_LC }}/backend-java:${{ github.sha }}

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend-python
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/backend-python:latest
            ghcr.io/${{ env.OWNER_LC }}/backend-python:${{ github.sha }}