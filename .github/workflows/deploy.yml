name: Deploy to OpenShift

on:
  push:
    branches: [main]
    paths:
      - 'infra/k8s/**'
      - 'backend-python/search-service/**'
      - 'backend-python/recommendation-service/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Log in to OpenShift
        run: |
          oc login --token="${{ secrets.OC_TOKEN }}" --server="${{ secrets.OC_SERVER }}"

      - name: Apply manifests
        run: |
          oc apply -f infra/k8s/postgres/
          oc apply -f infra/k8s/monitoring/
          oc apply -f infra/k8s/keepalive/
          oc apply -f infra/k8s/frontend-demo/
          oc apply -f infra/k8s/backend-java/
          oc apply -f infra/k8s/backend-python/
          oc apply -f infra/k8s/search-service/
          oc apply -f infra/k8s/edit-service/
          oc apply -f infra/k8s/recommendation-service/
          oc apply -f infra/k8s/auth-service/
          oc apply -f infra/k8s/group-service/

      - name: Roll out new images
        run: |
          oc rollout restart deployment/search-service -n natairankrat-dev
          oc rollout restart deployment/recommendation-service -n natairankrat-dev

      - name: Verify rollout
        run: |
          oc get pods -n natairankrat-dev
