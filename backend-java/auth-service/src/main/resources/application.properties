server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:traveldb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:}

auth.jwt.secret=${JWT_SECRET:}
auth.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
auth.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health