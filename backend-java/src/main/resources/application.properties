server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:traveldb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:}

services.recommendation.url=${RECOMMENDATION_SERVICE_URL:http://recommendation-service:8000}
services.search.url=${SEARCH_SERVICE_URL:http://search-service:8000}
services.edit.url=${EDIT_SERVICE_URL:http://edit-service:8000}

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always