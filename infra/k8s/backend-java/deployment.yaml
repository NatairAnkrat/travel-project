apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-java
  namespace: natairankrat-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-java
  template:
    metadata:
      labels:
        app: backend-java
    spec:
      containers:
        - name: backend-java
          image: ghcr.io/natairankrat/backend-java:latest
          ports:
            - containerPort: 8080
          env:
            - name: RECOMMENDATION_SERVICE_URL
              value: http://recommendation-service:8000
            - name: SEARCH_SERVICE_URL
              value: http://search-service:8000
            - name: EDIT_SERVICE_URL
              value: http://edit-service:8000
            - name: DB_HOST
              value: postgres-main
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: traveldb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-main-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-main-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-java
  namespace: natairankrat-dev
spec:
  selector:
    app: backend-java
  ports:
    - port: 8080
      targetPort: 8080