apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-python
  namespace: natairankrat-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-python
  template:
    metadata:
      labels:
        app: backend-python
    spec:
      containers:
        - name: backend-python
          image: ghcr.io/natairankrat/backend-python:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres-main
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: traveldb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-main-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-main-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-python
  namespace: natairankrat-dev
spec:
  selector:
    app: backend-python
  ports:
    - port: 8000
      targetPort: 8000