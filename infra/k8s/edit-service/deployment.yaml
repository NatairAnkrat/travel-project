apiVersion: apps/v1
kind: Deployment
metadata:
  name: edit-service
  namespace: natairankrat-dev
spec:
  replicas: 1 # stateless (no in-process jobs - it hands generation off to recommendation-service), safe to scale up
  selector:
    matchLabels:
      app: edit-service
  template:
    metadata:
      labels:
        app: edit-service
    spec:
      containers:
        - name: edit-service
          image: ghcr.io/natairankrat/edit-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres-main   # writes (new travel_version) must go to main, not hot/cold standbys
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: traveldb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-main-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-main-secret
                  key: POSTGRES_PASSWORD
            - name: RECOMMENDATION_SERVICE_URL
              value: http://recommendation-service:8000
            - name: SEARCH_SERVICE_URL
              value: http://search-service:8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: edit-service
  namespace: natairankrat-dev
spec:
  selector:
    app: edit-service
  ports:
    - port: 8000
      targetPort: 8000
