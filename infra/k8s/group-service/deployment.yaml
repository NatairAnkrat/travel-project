apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-service
  namespace: natairankrat-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-service
  template:
    metadata:
      labels:
        app: group-service
    spec:
      containers:
        - name: group-service
          image: ghcr.io/natairankrat/group-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: FRONTEND_ORIGIN
              value: https://frontend-natairankrat-dev.apps.rm2.thpm.p1.openshiftapps.com
            - name: DB_HOST
              value: postgres-main
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: traveldb
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-main-secret, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-main-secret, key: POSTGRES_PASSWORD }
          resources:
            requests: { memory: "384Mi", cpu: "250m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: group-service
  namespace: natairankrat-dev
spec:
  selector:
    app: group-service
  ports:
    - port: 8080
      targetPort: 8080