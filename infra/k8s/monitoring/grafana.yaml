apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: natairankrat-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-secret
          volumeMounts:
            - name: datasource-config
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-postgresql
              mountPath: /var/lib/grafana/dashboards/postgresql
            - name: storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasource-config
          configMap:
            name: grafana-datasource
        - name: dashboard-provider-config
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-postgresql
          configMap:
            name: grafana-dashboard-postgresql
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: natairankrat-dev
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
