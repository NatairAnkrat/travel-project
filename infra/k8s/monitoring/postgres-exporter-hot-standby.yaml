# infra/k8s/monitoring/postgres-exporter-hot-standby.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter-hot-standby
  namespace: natairankrat-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter-hot-standby
  template:
    metadata:
      labels:
        app: postgres-exporter-hot-standby
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: DATA_SOURCE_NAME_HOT
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-hot-standby
  namespace: natairankrat-dev
spec:
  selector:
    app: postgres-exporter-hot-standby
  ports:
    - port: 9187
      targetPort: 9187