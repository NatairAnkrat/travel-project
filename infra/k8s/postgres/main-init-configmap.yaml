# infra/k8s/postgres/main-init-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-main-init
  namespace: natairankrat-dev
data:
  01-create-replicator.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '$REPLICATION_PASSWORD';
    EOSQL
  02-allow-replication.sh: |
    #!/bin/bash
    set -e
    echo "host replication replicator all md5" >> "$PGDATA/pg_hba.conf"