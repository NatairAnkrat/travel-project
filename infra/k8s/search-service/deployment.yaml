apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: natairankrat-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: ghcr.io/natairankrat/search-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERPAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-apis-secret
                  key: SERPAPI_API_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: natairankrat-dev
spec:
  selector:
    app: search-service
  ports:
    - port: 8000
      targetPort: 8000
